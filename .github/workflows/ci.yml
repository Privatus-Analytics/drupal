name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - drupal: "^10.3"
            php: "8.1"
          - drupal: "^11"
            php: "8.3"
          - drupal: "^11"
            php: "8.4"
    steps:
      - uses: actions/checkout@v7
        with:
          path: privatus_analytics
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - name: Set up a Drupal ${{ matrix.drupal }} site with the module
        run: |
          composer create-project --no-interaction --no-progress "drupal/recommended-project:${{ matrix.drupal }}" drupal
          cd drupal
          composer config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config --no-plugins allow-plugins.phpstan/extension-installer true
          composer config --no-plugins allow-plugins.tbachert/spi true
          composer require --dev --no-interaction --no-progress -W "drupal/core-dev:${{ matrix.drupal }}" drupal/coder
          mkdir -p web/modules/contrib web/sites/simpletest/browser_output
          cp -r "$GITHUB_WORKSPACE/privatus_analytics" web/modules/contrib/privatus_analytics
      - name: PHPUnit (unit and kernel tests)
        working-directory: drupal
        env:
          SIMPLETEST_DB: sqlite://localhost//tmp/test.sqlite
          SIMPLETEST_BASE_URL: http://localhost
        run: vendor/bin/phpunit -c web/core web/modules/contrib/privatus_analytics/tests
      - name: PHP_CodeSniffer (Drupal and DrupalPractice)
        working-directory: drupal/web/modules/contrib/privatus_analytics
        run: "$GITHUB_WORKSPACE/drupal/vendor/bin/phpcs"
